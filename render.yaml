services:
  - type: web
    name: noah-backend
    runtime: docker
    dockerfilePath: ./noah_backend/Dockerfile
    dockerContext: ./noah_backend
    plan: free
    region: frankfurt
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.6-27b
      - key: LLM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
